name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: jdx/mise-action@v2
        with:
          install: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # the release gate runs the full suite INCLUDING the e2e contracts
      # against real mise (lock determinism/symlink clobber, one-off
      # install semantics) — mise-behavior drift must block a release
      - name: Test
        run: |
          go test ./...
          go test -tags e2e ./internal/e2e/

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          # a PAT with repo scope — the workflow GITHUB_TOKEN is
          # mison-repo-local and cannot push the formula to the
          # cross-repo homebrew tap
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
