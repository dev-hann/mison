version: 2

project_name: mison

before:
  hooks:
    - go mod tidy

builds:
  - id: mison
    main: ./cmd/mison
    binary: mison
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

brews:
  - repository:
      owner: dev-hann
      name: homebrew-tap
      branch: main
    directory: Formula
    homepage: https://github.com/dev-hann/mison
    description: Reproduce your development environment anywhere (mise + GitHub)
    license: MIT
    install: |
      bin.install "mison"
    caveats: |
      The installer (curl https://raw.githubusercontent.com/dev-hann/mison/main/scripts/install.sh | sh)
      keeps the binary in ~/.local/bin. Pick ONE install method and stick to it.

checksum:
  name_template: "checksums.txt"

release:
  draft: false
  prerelease: auto
  extra_files:
    - glob: scripts/install.sh

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - Merge pull request
